---
layout: default
---
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "TechArticle",
      "@id": "{{ page.url | absolute_url }}#article",
      "url": "{{ page.url | absolute_url }}",
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": "en",
      "author": { "@id": "https://sdin.dev/#person" },
      "copyrightHolder": { "@id": "https://sdin.dev/#person" },
      "copyrightYear": "2025",
      "license": "https://creativecommons.org/licenses/by/4.0/",
      "publisher": { "@id": "https://sdin.dev/#person" },
      "image": {
        "@type": "ImageObject",
        "url": "{{ '/assets/functional-programming-lectures-social.png' | absolute_url }}",
        "width": 1200,
        "height": 630
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ page.url | absolute_url }}"
      }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Functional Programming Lectures",
          "item": "{{ '/' | absolute_url }}"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ page.title | jsonify }},
          "item": "{{ page.url | absolute_url }}"
        }
      ]
    }
  ]
}
</script>

{{ content }}
